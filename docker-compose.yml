services:
  feishu-botd:
    build:
      context: .
      dockerfile: Dockerfile
    image: feishu-botd:latest
    container_name: feishu-botd
    restart: unless-stopped
    environment:
      FEISHU_BOTD_CONFIG: /etc/feishu-botd/config.json
    volumes:
      - ./config/feishu-botd.json:/etc/feishu-botd/config.json:ro
      # The whole secrets folder, so adding a provider token (see
      # `agent_providers` in docs/agent.md) is just a new file here —
      # no compose edit. Config paths reference /run/secrets/<file>.
      - ./secrets:/run/secrets:ro
      - ./scripts:/etc/feishu-botd/scripts:ro
      # Socket directory for the HTTP shim and gRPC listeners. A NAMED
      # volume, not a host bind: unix sockets cannot bind on macOS
      # host-shared paths (Docker Desktop), and a named volume works on
      # every platform. It inherits the image's 10001:10001 ownership on
      # first use. Another compose project on the same engine mounts it as
      # an external volume named `feishu-botd-run` to reach the sockets;
      # see docs/deployment.md.
      - feishu-botd-run:/run/feishu-botd
    ports:
      - "${FEISHU_BOTD_HOST_IP:-0.0.0.0}:7345:7345"

volumes:
  feishu-botd-run:
    # Fixed name (no compose-project prefix) so consumer projects can
    # reference it with `external: true` without knowing this project's
    # directory name.
    name: feishu-botd-run
