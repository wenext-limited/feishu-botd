syntax = "proto3";

package feishubotd.v1;

import "feishubotd/v1/common.proto";

option go_package = "feishu-botd/gen/feishubotd/v1;feishubotdv1";

// CommandService is the inbound @<bot-name> command path. botd owns the Feishu
// long connection and command dispatcher; providers Subscribe (server stream)
// and botd pushes matched commands, then the provider Responds. Server-streaming
// is deliberate: inbound is push-shaped, and a stream avoids polling and keeps
// Feishu credentials inside botd.
service CommandService {
  // Provider credentials travel in gRPC authorization metadata, never message
  // fields. Agent RPCs always require them; legacy Subscribe/Respond require
  // them when the daemon configures scoped agent_providers.
  rpc Subscribe(SubscribeRequest) returns (stream SubscribeResponse);
  rpc Respond(RespondRequest) returns (RespondResponse);

  // SubscribeAgentEvents is the full-fidelity agent ingress path. It is kept
  // separate from Subscribe so existing command consumers never receive an
  // event variant they do not understand.
  rpc SubscribeAgentEvents(SubscribeAgentEventsRequest) returns (stream SubscribeAgentEventsResponse);
  // Lazily reads the topic snapshot attached to one exact inbound delivery.
  // The first frame is metadata; subsequent frames carry bounded image chunks
  // so the 16 MiB domain image budget never depends on unary gRPC limits.
  rpc GetAgentAttachedContext(GetAgentAttachedContextRequest) returns (stream GetAgentAttachedContextResponse);
  rpc StartAgentResponse(StartAgentResponseRequest) returns (StartAgentResponseResponse);
  rpc UpdateAgentResponse(UpdateAgentResponseRequest) returns (UpdateAgentResponseResponse);
  rpc FinishAgentResponse(FinishAgentResponseRequest) returns (FinishAgentResponseResponse);
  // Replaces the content of a terminal CardKit response without reopening its
  // streaming lifecycle. Detached work uses this to settle the initial card.
  rpc ReplaceAgentResponse(ReplaceAgentResponseRequest) returns (ReplaceAgentResponseResponse);

  // UploadAgentImage puts one image into Feishu under the app that delivered
  // the event and returns the image_key a response markdown can embed. It is
  // client-streaming for the same reason GetAgentAttachedContext is server-
  // streaming: image bytes must not be bounded by unary gRPC message limits.
  rpc UploadAgentImage(stream UploadAgentImageRequest) returns (UploadAgentImageResponse);

  // SendAgentFollowUp posts one later message into a conversation that already
  // delivered an agent event to this provider. This is the compatibility path
  // when a terminal response handle is unavailable for in-place replacement.
  rpc SendAgentFollowUp(SendAgentFollowUpRequest) returns (SendAgentFollowUpResponse);

  // Retain an existing conversation scope for a durable scheduled task.
  rpc RetainAgentConversation(RetainAgentConversationRequest) returns (RetainAgentConversationResponse);
  rpc ReleaseAgentConversation(ReleaseAgentConversationRequest) returns (ReleaseAgentConversationResponse);

  // AddAgentReaction places one native Feishu reaction, chosen by the
  // provider rather than the daemon, on the message that triggered this
  // response. Gated by its own grant, separate from AllowMessageReactions
  // (that one is about *receiving* thumbsup/thumbsdown verdicts) and from
  // the daemon-driven WorkingReactionEmoji: unlike that one, a reaction
  // placed here is never auto-removed — it is a deliberate answer, not a
  // busy signal, so it outlives the response.
  rpc AddAgentReaction(AddAgentReactionRequest) returns (AddAgentReactionResponse);

  // PostAgentMessage posts one ordinary message that no inbound delivery
  // triggered: a new root message in a chat the provider is granted, or a
  // reply (optionally in a Feishu thread) to a message_ref botd delivered or
  // authored. Every posted message is agent-owned by this provider, so an
  // unmentioned reply to it routes back exactly like a reply to a response
  // card. Gated by allow_proactive_messages and the provider's
  // proactive_chat_aliases allowlist.
  rpc PostAgentMessage(PostAgentMessageRequest) returns (PostAgentMessageResponse);

  // PostAgentCard is PostAgentMessage for a card that can change later: the
  // same targets, grants, idempotency, and agent ownership, but the content
  // is typed and botd renders it as a Card JSON 2.0 CardKit entity. The
  // returned message_ref is the handle UpdateAgentCard and PinAgentMessage
  // take; the CardKit card id and its sequence stay inside botd.
  rpc PostAgentCard(PostAgentCardRequest) returns (PostAgentCardResponse);
  // UpdateAgentCard replaces the whole content of a card this provider
  // posted with PostAgentCard. Updates to one card are applied in arrival
  // order, one at a time, and a backlog collapses to its newest entry.
  // Gated by allow_proactive_messages, like the post that created the card.
  rpc UpdateAgentCard(UpdateAgentCardRequest) returns (UpdateAgentCardResponse);
  // PinAgentMessage pins a message this provider authored (a posted card,
  // post, response, or follow-up botd retained a route for) to its chat's
  // pin list. Gated by allow_pins.
  rpc PinAgentMessage(PinAgentMessageRequest) returns (PinAgentMessageResponse);
  // CreateAgentChat creates a group chat with the bot as owner, inviting the
  // given members, and grants it to this provider at runtime: the returned
  // chat_alias is in the provider's ambient and proactive allowlists and
  // accepts commands, with no config edit, and the grant survives restarts
  // (it is kept in state_dir). Gated by allow_create_chats.
  rpc CreateAgentChat(CreateAgentChatRequest) returns (CreateAgentChatResponse);
  // InviteAgentChatMembers adds members to a chat this provider created with
  // CreateAgentChat. Already-members are not an error. Gated by
  // allow_create_chats.
  rpc InviteAgentChatMembers(InviteAgentChatMembersRequest) returns (InviteAgentChatMembersResponse);
  // RenameAgentChat renames a chat this provider created with
  // CreateAgentChat. Gated by allow_create_chats.
  rpc RenameAgentChat(RenameAgentChatRequest) returns (RenameAgentChatResponse);
}

// ProviderService is the FUTURE pull path (botd asks a registered client to
// supply data for a card or menu). Kept SEPARATE from CommandService because
// providers are pull (botd -> client on demand) while commands are push
// (user -> botd -> client). Unary; the implementation returns
// codes.Unimplemented in this slice and the service is NOT registered yet.
service ProviderService {
  rpc RegisterProvider(RegisterProviderRequest) returns (RegisterProviderResponse);
}

message SubscribeRequest {
  // Logical id (e.g. "example-service"). In scoped mode it must match the
  // bearer-authenticated principal and commands must be config-allowed.
  string provider = 1;
  repeated string commands = 2; // command names this provider handles
  reserved 3 to 15;
}

// SubscribeResponse wraps each streamed inbound command.
message SubscribeResponse {
  InboundCommand command = 1;
}

message InboundCommand {
  // Opaque botd-derived retry/claim handle; never a raw Feishu event id.
  string delivery_id = 1; // echo in RespondRequest
  string command = 2; // e.g. "status"
  string text = 3; // remaining args
  string chat_alias = 4; // resolved alias, never a raw chat id
  string sender_id = 5; // opaque Feishu sender id
  // Provider-safe allowlist (currently chat_type and message_type). Raw Feishu
  // event, message, thread, root, parent, and chat ids are omitted.
  map<string, string> metadata = 6;
  reserved 7 to 31;
}

message RespondRequest {
  string delivery_id = 1;
  oneof reply {
    MarkdownContent markdown = 10;
    CardContent card = 11;
  }
  reserved 2 to 9, 12 to 31;
}

message RespondResponse {
  bool accepted = 1;
}

// SubscribeAgentEventsRequest selects the provider-owned agent event stream.
// Exact command matches win. include_unmatched_messages receives P2P prompts
// and otherwise-unhandled group mentions, which is the natural chat-agent mode.
message SubscribeAgentEventsRequest {
  // Must match the bearer-authenticated principal. Every selector below is
  // checked against that principal's configured allowlist before registration.
  string provider = 1;
  repeated string commands = 2;
  bool include_unmatched_messages = 3;
  bool include_card_actions = 4;
  // Native Feishu reactions attached to agent-authored messages. This is a
  // separate permission and event family from interactive card actions.
  bool include_message_reactions = 5;
  // Ambient group messages: every human text message in a group chat this
  // provider is granted (allow_ambient_messages plus ambient_chat_aliases),
  // whether or not it mentions the bot. Delivered as InboundAgentMessage with
  // addressing = AMBIENT. An ambient event is an observation, not a prompt:
  // it carries no response capability, so Start/Follow-up on its delivery_id
  // are rejected. A message that is also addressed (mention or reply to an
  // agent-owned message) is delivered once, with the addressed variant.
  // Requires the app's im:message.group_msg scope.
  bool include_ambient_messages = 6;
  reserved 7 to 15;
}

message SubscribeAgentEventsResponse {
  InboundAgentEvent event = 1;
}

message InboundAgentEvent {
  // Opaque botd-derived retry/claim handle; never a raw Feishu event id.
  string delivery_id = 1;
  string conversation_id = 2; // opaque botd-derived conversation identity
  string chat_alias = 3; // configured alias or "direct"; never a raw chat id
  string sender_id = 4; // opaque Feishu sender identity
  map<string, string> metadata = 5;
  oneof payload {
    InboundAgentMessage message = 10;
    InboundCardAction card_action = 11;
    InboundMessageReaction message_reaction = 12;
  }
  reserved 6 to 9, 13 to 31;
}

message InboundAgentMessage {
  string text = 1; // complete mention-stripped prompt; newlines are preserved
  string command = 2; // optional normalized first word
  string command_text = 3; // optional remainder for command-style agents
  // Opaque identity of the exact bot-authored message this prompt replies to.
  // Empty means this is not an explicit reply. Raw Feishu parent ids stay in
  // botd.
  string reply_to_message_ref = 4;
  // Current group title as untrusted, provider-safe context. Empty for direct
  // messages and when the fail-soft chat lookup is unavailable.
  string conversation_title = 5;

  // Stable provider-safe identity of this inbound message, in the same
  // message_ref space as AgentResponseReceipt.message_ref. It is a valid
  // PostAgentMessage reply target for this provider when the message's chat
  // is in the provider's proactive_chat_aliases.
  string message_ref = 11;
  // Opaque identity of the Feishu thread (topic) holding this message; empty
  // when the message is not in a thread.
  string thread_ref = 7;
  // message_ref of the thread's root message, which may be bot- or
  // human-authored; empty when the message is not in a thread or is itself
  // the root. Lets a provider tie a reply-to-a-reply back to the root it
  // mirrored, which reply_to_message_ref (the direct parent) cannot.
  string thread_root_message_ref = 8;
  // Why botd delivered this message to this provider.
  InboundAddressing addressing = 9;
  // People (not bots) mentioned in the message, in order of appearance.
  // text renders each of them inline as "@<name>"; the bot's own mention is
  // still stripped. Populated, and text rendered that way, only for a
  // provider granted allow_ambient_messages, which already observes every
  // member of its chats. Every other provider keeps the historical text
  // byte-for-byte (raw mention keys in plain text, "@participant" in rich
  // text) and an empty list.
  repeated InboundMention mentions = 10;
  // The sender's company email address, for a provider configured with
  // allow_sender_email and empty for every other provider. Resolved through
  // the Contact API from the sender's open_id: enterprise_email, or email
  // when that is empty. Fail-soft: empty when the app lacks the contact
  // scope, the lookup fails, or the user has no address. It is personal data,
  // so a provider should use it to act for this person and never log it.
  string sender_email = 6;
}

enum InboundAddressing {
  INBOUND_ADDRESSING_UNSPECIFIED = 0;
  INBOUND_ADDRESSING_DIRECT = 1; // p2p chat with the bot
  INBOUND_ADDRESSING_MENTION = 2; // group message that mentions the bot
  INBOUND_ADDRESSING_REPLY = 3; // unmentioned reply to an agent-owned message
  INBOUND_ADDRESSING_AMBIENT = 4; // include_ambient_messages observation
}

message InboundMention {
  // Opaque provider-safe user identity, the same space as
  // InboundAgentEvent.sender_id and SendAgentFollowUpRequest.mention_user_id.
  string user_id = 1;
  // Display name as the Feishu event carried it. Untrusted label.
  string name = 2;
}

message GetAgentAttachedContextRequest {
  string provider = 1; // must match the bearer-authenticated principal
  // Exact opaque delivery capability received from SubscribeAgentEvents.
  // No conversation-latest fallback exists, and the capability expires soon.
  string delivery_id = 2;
  reserved 3 to 15;
}

enum AgentAttachedContextStatus {
  AGENT_ATTACHED_CONTEXT_STATUS_UNSPECIFIED = 0;
  AGENT_ATTACHED_CONTEXT_STATUS_FOUND = 1;
  AGENT_ATTACHED_CONTEXT_STATUS_MISSING = 2;
  AGENT_ATTACHED_CONTEXT_STATUS_UNREADABLE = 3;
}

enum AgentAttachedContextIssueCode {
  AGENT_ATTACHED_CONTEXT_ISSUE_CODE_UNSPECIFIED = 0;
  AGENT_ATTACHED_CONTEXT_ISSUE_CODE_NO_THREAD = 1;
  AGENT_ATTACHED_CONTEXT_ISSUE_CODE_HISTORY_UNREADABLE = 2;
  AGENT_ATTACHED_CONTEXT_ISSUE_CODE_BOUNDARY_NOT_FOUND = 3;
  AGENT_ATTACHED_CONTEXT_ISSUE_CODE_BOUNDARY_SCAN_LIMIT = 4;
  AGENT_ATTACHED_CONTEXT_ISSUE_CODE_MESSAGE_LIMIT = 5;
  AGENT_ATTACHED_CONTEXT_ISSUE_CODE_TEXT_LIMIT = 6;
  AGENT_ATTACHED_CONTEXT_ISSUE_CODE_IMAGE_LIMIT = 7;
  AGENT_ATTACHED_CONTEXT_ISSUE_CODE_IMAGE_TOO_LARGE = 8;
  AGENT_ATTACHED_CONTEXT_ISSUE_CODE_TOTAL_IMAGE_LIMIT = 9;
  AGENT_ATTACHED_CONTEXT_ISSUE_CODE_IMAGE_UNREADABLE = 10;
  AGENT_ATTACHED_CONTEXT_ISSUE_CODE_IMAGE_TYPE_UNSUPPORTED = 11;
  AGENT_ATTACHED_CONTEXT_ISSUE_CODE_VIDEO_OMITTED = 12;
  AGENT_ATTACHED_CONTEXT_ISSUE_CODE_UNSUPPORTED_MESSAGE = 13;
  AGENT_ATTACHED_CONTEXT_ISSUE_CODE_MALFORMED_MESSAGE = 14;
  // Video carry (ADR-0126). VIDEO_OMITTED (12) now means the provider has no
  // allow_attached_video grant; the codes below describe a granted video that
  // could not be delivered.
  AGENT_ATTACHED_CONTEXT_ISSUE_CODE_VIDEO_LIMIT = 15;
  AGENT_ATTACHED_CONTEXT_ISSUE_CODE_VIDEO_TOO_LARGE = 16;
  AGENT_ATTACHED_CONTEXT_ISSUE_CODE_VIDEO_UNREADABLE = 17;
  AGENT_ATTACHED_CONTEXT_ISSUE_CODE_VIDEO_TYPE_UNSUPPORTED = 18;
  AGENT_ATTACHED_CONTEXT_ISSUE_CODE_VIDEO_TOO_LONG = 19;
}

message AgentAttachedContextIssue {
  AgentAttachedContextIssueCode code = 1;
  uint32 count = 2;
}

message AgentAttachedContextImageDescriptor {
  // Monotonic across the snapshot and referenced by image chunk frames.
  uint32 image_index = 1;
  string media_type = 2; // server-detected allowlisted image MIME type
  uint64 byte_size = 3;
}

// A video the daemon downloaded and bounded but never decoded (ADR-0126).
// The provider turns it into frames itself; only accepted videos get a
// descriptor, a declined one keeps its placeholder text and an issue.
message AgentAttachedContextVideoDescriptor {
  // Monotonic across the snapshot and referenced by video chunk frames.
  uint32 video_index = 1;
  string media_type = 2; // server-detected allowlisted video MIME type
  uint64 byte_size = 3;
  uint64 duration_ms = 4; // Feishu-declared; 0 when unknown
  string file_name = 5; // Feishu-declared, bounded to 256 bytes; may be empty
}

message AgentAttachedContextMessage {
  // Oldest-first topic order. participant-N labels are snapshot-local and do
  // not encode a stable Feishu identity.
  string author_label = 1;
  string author_type = 2;
  string text = 3;
  repeated AgentAttachedContextImageDescriptor images = 4;
  repeated AgentAttachedContextVideoDescriptor videos = 5;
}

message AgentAttachedContextHeader {
  // Snapshot-local participant label of the triggering sender; empty if unknown.
  // No raw sender identity crosses the provider boundary.
  string requester_label = 5;
  AgentAttachedContextStatus status = 1;
  repeated AgentAttachedContextMessage messages = 2;
  repeated AgentAttachedContextIssue issues = 3;
  bool truncated = 4;
}

message AgentAttachedContextImageChunk {
  uint32 image_index = 1;
  uint64 offset = 2;
  bytes data = 3; // at most 64 KiB per frame
  bool final = 4;
}

// Video bytes follow every image chunk, in video_index order, with the same
// offset/final contract as image chunks.
message AgentAttachedContextVideoChunk {
  uint32 video_index = 1;
  uint64 offset = 2;
  bytes data = 3; // at most 64 KiB per frame
  bool final = 4;
}

message GetAgentAttachedContextResponse {
  oneof frame {
    AgentAttachedContextHeader header = 1;
    AgentAttachedContextImageChunk image_chunk = 2;
    AgentAttachedContextVideoChunk video_chunk = 3;
  }
}

// Outbound images are the mirror of the attached-context path above. A card
// renders an image only from an image_key minted by Feishu, so a provider that
// wants one in its answer uploads the bytes here and embeds the returned key as
// ![alt](image_key) in markdown. External URLs never render, which is also why
// a provider cannot simply link a picture that lives on its own network.
message UploadAgentImageHeader {
  string provider = 1; // must match the bearer-authenticated principal
  // The delivery whose app uploads the image. image_key is tenant- and
  // app-scoped, so the upload has to happen under the same app that will
  // render it. Set this, or conversation_id, never both.
  string delivery_id = 2;
  // Provider-generated idempotency key. Replaying it returns the first upload's
  // image_key with duplicate=true rather than minting a second key.
  string operation_id = 3;
  // Conversation-scoped alternative to delivery_id. Same authorization as
  // SendAgentFollowUp: the provider must have received an agent event in this
  // conversation inside the dedupe TTL. A later message — a build result, a
  // Nous answer — has no inbound delivery to pin an upload to, but it still
  // has to show a picture, and the conversation grant is the same bound that
  // already lets it speak.
  string conversation_id = 4;
}

message UploadAgentImageChunk {
  bytes data = 1; // at most 64 KiB per frame
}

message UploadAgentImageRequest {
  // The first frame must be the header; every later frame must be a chunk.
  oneof frame {
    UploadAgentImageHeader header = 1;
    UploadAgentImageChunk chunk = 2;
  }
}

message UploadAgentImageResponse {
  // Embed as ![alt](image_key) inside AgentResponseContent.markdown, or as a
  // native post `img` element in a follow-up. Cards and ordinary messages
  // both render only from this key.
  string image_key = 1;
  bool duplicate = 2;
  // Image type as botd sniffed it from the bytes, not as the provider claimed.
  string media_type = 3;
}

message InboundCardAction {
  string response_id = 1;
  string action_id = 2;
  // Normalized JSON object containing typed Feishu action and form values.
  // Callback tokens, card ids, message ids, and raw chat ids are omitted.
  string payload_json = 3;
}

// A native emoji reaction attached below an agent-authored Feishu message.
// delivery_id and sender_id live on the enclosing InboundAgentEvent.
message InboundMessageReaction {
  string message_ref = 1;
  string reaction_type = 2;
  MessageReactionOperation operation = 3;
}

enum MessageReactionOperation {
  MESSAGE_REACTION_OPERATION_UNSPECIFIED = 0;
  MESSAGE_REACTION_OPERATION_ADDED = 1;
  MESSAGE_REACTION_OPERATION_REMOVED = 2;
}

message AgentResponseContent {
  string title = 1;
  // Always the complete accumulated answer, never a token delta.
  // Images render only from a Feishu image_key: upload the bytes with
  // UploadAgentImage and embed the returned key as ![alt](image_key).
  string markdown = 2;
  repeated AgentResponseAction actions = 3;
  reserved 4 to 15;

  // The optional run timeline. A collapsible panel exists for the whole
  // response iff Start carries a non-empty timeline_markdown or
  // timeline_title; a provider that sends neither gets the unchanged card.
  // timeline_markdown is the expanded body and, like markdown, is always the
  // complete accumulated snapshot. timeline_title is the collapsed header and
  // normally reads as the step currently running.
  string timeline_markdown = 16;
  string timeline_title = 17;
}

message AgentResponseAction {
  string action_id = 1;
  string label = 2;
  // Optional JSON object returned unchanged inside an action event payload.
  string payload_json = 3;
  AgentResponseActionStyle style = 4;
}

enum AgentResponseActionStyle {
  AGENT_RESPONSE_ACTION_STYLE_UNSPECIFIED = 0;
  AGENT_RESPONSE_ACTION_STYLE_DEFAULT = 1;
  AGENT_RESPONSE_ACTION_STYLE_PRIMARY = 2;
  AGENT_RESPONSE_ACTION_STYLE_DANGER = 3;
}

// AgentTimelineStep is one discrete unit of work inside a run. It is the typed
// counterpart to timeline_markdown, not a replacement: the markdown stays the
// rendered panel body, while steps describe the same run as structured
// transitions a native progress surface can consume. Neither is derived from
// the other, so a provider may send either, both, or neither.
message AgentTimelineStep {
  // Provider-stable identity, unique within one response. It is how a later
  // snapshot is matched to the step it advances, so the same unit of work must
  // keep the same id across requests rather than being regenerated.
  string step_id = 1;
  // Short human-readable line for the step, e.g. "Reading repository". It is
  // rendered verbatim and must therefore carry no user text, tool output, raw
  // commands, or credentials.
  string label = 2;
  AgentTimelineStepState state = 3;
}

enum AgentTimelineStepState {
  // Not a valid submitted state; a step must say which side of the transition
  // it is on.
  AGENT_TIMELINE_STEP_STATE_UNSPECIFIED = 0;
  AGENT_TIMELINE_STEP_STATE_STARTED = 1;
  AGENT_TIMELINE_STEP_STATE_FINISHED = 2;
}

message StartAgentResponseRequest {
  string provider = 1; // must match the bearer-authenticated principal
  string delivery_id = 2;
  // Provider-generated idempotency key. Reusing it with different content is
  // rejected; retrying the same operation returns duplicate=true.
  string operation_id = 3;
  AgentResponseContent content = 10;
  reserved 4 to 9, 11, 14 to 31;

  // Post the card inside a Feishu thread under the triggering message,
  // opening one on it if it has none, so a group's main timeline keeps only
  // the question. Honored for a group delivery that replies to its triggering
  // message; ignored for a direct message. When the card opens the thread,
  // the thread counts as this provider's: a later message in it reaches the
  // provider as an unmentioned reply (addressing REPLY), exactly as a reply to
  // the card itself would. A thread someone else opened is never claimed.
  bool reply_in_thread = 13;

  // The run timeline as typed steps. It sits on the request rather than inside
  // content because Update and Finish carry it at the same level, and because a
  // step list is run progress rather than card body: the collapsible panel is
  // still opened and rendered by content.timeline_markdown alone.
  //
  // Like timeline_markdown, the list is always the complete accumulated set of
  // steps for the run so far, never a delta. Steps are optional and purely
  // additive: a provider that sends none behaves exactly as it did before this
  // field existed.
  repeated AgentTimelineStep timeline_steps = 12;
}

message UpdateAgentResponseRequest {
  string provider = 1; // must match the bearer-authenticated principal
  string response_id = 2;
  string operation_id = 3;
  uint64 expected_revision = 4;
  // Complete accumulated answer. The initial successful Start has revision 1.
  string markdown = 10;
  reserved 5 to 9, 11, 13 to 31;

  // Timeline parts for a response whose Start created a panel. Each field is
  // independent and empty means "leave that part unchanged"; a non-empty value
  // replaces it, so timeline_markdown is a cumulative snapshot exactly like
  // markdown. Both are ignored on a response with no panel.
  string timeline_markdown = 32;
  string timeline_title = 33;
  // The step list follows the same rules: cumulative, and empty means
  // unchanged. A non-empty list is the complete accumulated set of steps for
  // the run so far and replaces the previously submitted one wholesale, so a
  // request that advances one step still carries the steps already finished.
  // Steps are correlated by step_id, which makes a repeated or reordered
  // snapshot idempotent rather than a duplicate transition.
  repeated AgentTimelineStep timeline_steps = 12;
}

message FinishAgentResponseRequest {
  string provider = 1; // must match the bearer-authenticated principal
  string response_id = 2;
  string operation_id = 3;
  uint64 expected_revision = 4;
  AgentResponseOutcome outcome = 5;
  string markdown = 10; // complete final answer
  string summary = 11; // compact fallback/notification text for the final card
  reserved 6 to 9, 13 to 31;

  // Final timeline parts, with the same empty-means-unchanged rule as Update.
  // A finished panel keeps its last streaming header unless timeline_title
  // carries the completed-state line the run should settle on.
  string timeline_markdown = 32;
  string timeline_title = 33;
  // Final cumulative step list, read exactly as in Update. A provider need not
  // re-send every step only to close it: the run itself ends here, and any step
  // still left in the started state is settled by outcome.
  repeated AgentTimelineStep timeline_steps = 12;
}

enum AgentResponseOutcome {
  AGENT_RESPONSE_OUTCOME_UNSPECIFIED = 0;
  AGENT_RESPONSE_OUTCOME_COMPLETED = 1;
  AGENT_RESPONSE_OUTCOME_FAILED = 2;
  AGENT_RESPONSE_OUTCOME_CANCELLED = 3;
}

enum AgentResponsePhase {
  AGENT_RESPONSE_PHASE_UNSPECIFIED = 0;
  AGENT_RESPONSE_PHASE_STREAMING = 1;
  AGENT_RESPONSE_PHASE_COMPLETED = 2;
  AGENT_RESPONSE_PHASE_FAILED = 3;
  AGENT_RESPONSE_PHASE_CANCELLED = 4;
}

message AgentResponseReceipt {
  string response_id = 1; // opaque update capability; Feishu ids remain private
  uint64 revision = 2;
  AgentResponsePhase phase = 3;
  bool duplicate = 4;
  // Stable provider-safe identity of the authored Feishu message. It is not an
  // update capability and cannot be used to address arbitrary platform ids.
  string message_ref = 5;
}

message StartAgentResponseResponse {
  AgentResponseReceipt response = 1;

  // The sender's Feishu display name, and only when this provider's own
  // configuration singles that sender out by name — today that means a
  // working_reaction_sender_overrides entry matched them. Empty for every
  // other sender, and empty always for a provider that configures no
  // overrides, which is also the only case where no contact lookup happens
  // at all. It is the name the Contact API answered with, not the config key
  // that matched it.
  //
  // It sits here and not on AgentResponseReceipt because it is a fact about
  // the delivery, settled once when the response opens; the receipt is
  // returned by Update, Finish and Replace as well, and re-sending it there
  // would read as a per-revision fact.
  //
  // A label, never an identity: it addresses no message, looks nobody up,
  // and is the same string this provider already wrote in its own config.
  // Feishu ids remain private, as everywhere else on this service.
  string matched_sender_label = 2;

  // Thread holding the card; empty when the card is not in a thread. The same
  // opaque identity as InboundAgentMessage.thread_ref, so a provider can tie a
  // later message in the thread back to this response.
  string thread_ref = 3;
}

message UpdateAgentResponseResponse {
  AgentResponseReceipt response = 1;
}

message FinishAgentResponseResponse {
  AgentResponseReceipt response = 1;
}

message ReplaceAgentResponseRequest {
  string provider = 1; // must match the bearer-authenticated principal
  string response_id = 2;
  string operation_id = 3;
  uint64 expected_revision = 4;
  string markdown = 10; // complete replacement answer
  string summary = 11; // compact notification/preview text
  reserved 5 to 9, 12 to 31;

  // Complete terminal panel snapshot. The response phase stays terminal.
  string timeline_markdown = 32;
  string timeline_title = 33;
}

message ReplaceAgentResponseResponse {
  AgentResponseReceipt response = 1;
}

// SendAgentFollowUpRequest delivers a standalone message into an existing
// conversation. It is an ordinary message rather than a CardKit streaming
// entity, so it has no revision and cannot be updated after delivery.
message SendAgentFollowUpRequest {
  string provider = 1; // must match the bearer-authenticated principal
  // Opaque conversation identity taken from a previously delivered
  // InboundAgentEvent. botd resolves the concrete route privately.
  string conversation_id = 2;
  // Provider-generated idempotency key. Reusing it with different content is
  // rejected; retrying the same operation returns duplicate=true.
  string operation_id = 3;
  string markdown = 10; // complete follow-up body
  string summary = 11; // compact notification/preview text
  // Optional native Feishu mention prepended to the first post paragraph.
  // The id is an opaque provider-safe user identity (normally an open_id).
  string mention_user_id = 12;
  // Optional durable task lease. An invalid lease never falls back to ingress scope.
  string conversation_lease_id = 13;
  // Strictly increasing per lease for new logical messages; unchanged on retry.
  uint64 conversation_lease_sequence = 14;
  reserved 4 to 9, 15 to 31;
}

message AgentFollowUpReceipt {
  // Opaque delivery handle. Feishu message, thread, and chat ids stay private.
  string follow_up_id = 1;
  bool duplicate = 2;
  // Opaque authored-message reference for reply-chain correlation.
  string message_ref = 3;
}

message SendAgentFollowUpResponse {
  AgentFollowUpReceipt follow_up = 1;
}

message PostAgentMessageRequest {
  string provider = 1; // must match the bearer-authenticated principal
  // Provider-generated idempotency key. Reusing it with different content is
  // rejected; retrying the same operation returns duplicate=true and the first
  // post's refs.
  string operation_id = 2;
  oneof target {
    // New root message in this configured or opaque chat alias. Must be in
    // the provider's proactive_chat_aliases.
    string chat_alias = 3;
    // Reply to a message_ref this provider received (any addressing) or
    // authored (responses, follow-ups, earlier posts). The reply lands in the
    // chat that message lives in, which must also be in
    // proactive_chat_aliases.
    string reply_to_message_ref = 4;
  }
  // With reply_to_message_ref: reply inside a Feishu thread, opening one on
  // the target if it has none. Ignored for chat_alias.
  bool reply_in_thread = 5;
  string markdown = 10; // complete body
  string summary = 11; // compact notification/preview text
  // Optional native Feishu mention prepended to the first post paragraph.
  string mention_user_id = 12;
  reserved 6 to 9, 13 to 31;
}

message PostAgentMessageResponse {
  // Stable provider-safe identity of the posted message: a later
  // PostAgentMessage reply target, and what InboundAgentMessage carries as
  // reply_to_message_ref / thread_root_message_ref when people answer it.
  string message_ref = 1;
  // Thread holding the posted message; empty for an unthreaded root.
  string thread_ref = 2;
  bool duplicate = 3;
}

// AgentCardState is the lifecycle tag in a posted card's header. botd owns
// the wording and the colour, so every provider's cards read the same way.
enum AgentCardState {
  // No tag; the header keeps the default colour.
  AGENT_CARD_STATE_UNSPECIFIED = 0;
  AGENT_CARD_STATE_PROCESSING = 1; // 进行中, blue
  AGENT_CARD_STATE_ACTIVE = 2; // 已回答, green
  AGENT_CARD_STATE_SUSPENDED = 3; // 等人处理, orange
  AGENT_CARD_STATE_ARCHIVED = 4; // 已归档, grey
}

// One checklist line. label is rendered as plain text, never markdown.
message AgentCardStep {
  string label = 1;
  bool done = 2;
}

// One link button under the card body. url must be an absolute https URL.
message AgentCardLink {
  string label = 1;
  string url = 2;
}

// AgentCardContent is the complete content of a posted card. Every post and
// update carries all of it: an update replaces the card wholesale, so a field
// left empty is removed from the card rather than kept.
message AgentCardContent {
  string title = 1; // required; plain-text header title
  AgentCardState state = 2;
  // Optional card body. Images render only from a Feishu image_key, exactly
  // as in AgentResponseContent.markdown.
  string markdown = 3;
  repeated AgentCardStep steps = 4; // at most 50, rendered in order
  repeated AgentCardLink links = 5; // at most 10
  // Compact notification/preview text; the title when empty.
  string summary = 6;
  reserved 7 to 15;
}

message PostAgentCardRequest {
  string provider = 1; // must match the bearer-authenticated principal
  // Provider-generated idempotency key, with PostAgentMessage's rules: the
  // same content returns duplicate=true and the first post's refs, different
  // content is rejected. The key space is separate from PostAgentMessage's.
  string operation_id = 2;
  oneof target {
    // New root message in this configured or opaque chat alias. Must be in
    // the provider's proactive_chat_aliases.
    string chat_alias = 3;
    // Reply to a message_ref this provider received or authored, in a chat
    // that is in proactive_chat_aliases.
    string reply_to_message_ref = 4;
  }
  // With reply_to_message_ref: reply inside a Feishu thread, opening one on
  // the target if it has none. Ignored for chat_alias.
  bool reply_in_thread = 5;
  AgentCardContent content = 10;
  reserved 6 to 9, 11 to 31;
}

message PostAgentCardResponse {
  // Stable provider-safe identity of the card message, in the same space as
  // PostAgentMessageResponse.message_ref: an UpdateAgentCard and
  // PinAgentMessage handle, a PostAgentMessage reply target, and what
  // InboundAgentMessage carries when people answer the card.
  string message_ref = 1;
  // Thread holding the card; empty for an unthreaded root.
  string thread_ref = 2;
  bool duplicate = 3;
}

message UpdateAgentCardRequest {
  string provider = 1; // must match the bearer-authenticated principal
  // message_ref returned by this provider's PostAgentCard. Any other ref,
  // including another provider's card, is unknown_message.
  string message_ref = 2;
  // Provider-generated idempotency key. Reusing it with different content is
  // rejected; retrying the same operation returns duplicate=true.
  string operation_id = 3;
  AgentCardContent content = 10; // complete replacement content
  reserved 4 to 9, 11 to 31;
}

message UpdateAgentCardResponse {
  bool duplicate = 1;
  // True when a newer update to the same card arrived while this one was
  // queued, so botd applied that one instead. The card shows content at
  // least as new as this request; a replay of this operation stays true.
  bool superseded = 2;
}

message PinAgentMessageRequest {
  string provider = 1; // must match the bearer-authenticated principal
  // message_ref of a message this provider authored. Pinning is idempotent:
  // Feishu answers a repeated pin with the existing pin, so no operation_id
  // is needed.
  string message_ref = 2;
  reserved 3 to 15;
}

message PinAgentMessageResponse {
  reserved 1 to 15;
}

message CreateAgentChatRequest {
  string provider = 1; // must match the bearer-authenticated principal
  // Provider-generated idempotency key: a retry with the same name and
  // members returns the first call's chat with duplicate=true; the same key
  // with a different request is rejected. Kept in state_dir, so a retry
  // after a restart does not create a second chat.
  string operation_id = 2;
  // The chat's name, e.g. "[Agents] refund-v2".
  string name = 3;
  // Optional chat description.
  string description = 4;
  // Feishu open_ids (ou_...) of the people to add. May be empty: the bot is
  // the owner and only member then.
  repeated string member_open_ids = 5;
  reserved 6 to 15;
}

message CreateAgentChatResponse {
  // The chat's opaque alias: a PostAgentMessage / PostAgentCard chat_alias,
  // and the chat_alias inbound and ambient deliveries from it carry.
  string chat_alias = 1;
  bool duplicate = 2;
  // open_ids Feishu could not add (left the tenant, not visible to the app).
  // The chat exists regardless.
  repeated string invalid_open_ids = 3;
  // When adding the members failed as a whole for a reason a retry will not
  // fix (e.g. the app lacks im:chat.members:write_only), the chat is still
  // created and granted: these are the members that were not added, and
  // members_error is botd's error class (e.g. chat_permission_denied). A
  // transient failure fails the call instead, and a retry with the same
  // operation_id adds them.
  repeated string unadded_open_ids = 4;
  string members_error = 5;
  reserved 6 to 15;
}

message InviteAgentChatMembersRequest {
  string provider = 1; // must match the bearer-authenticated principal
  // A chat_alias returned by this provider's CreateAgentChat. Any other
  // alias is unknown_chat.
  string chat_alias = 2;
  repeated string member_open_ids = 3;
  reserved 4 to 15;
}

message InviteAgentChatMembersResponse {
  repeated string invalid_open_ids = 1;
  reserved 2 to 15;
}

message RenameAgentChatRequest {
  string provider = 1; // must match the bearer-authenticated principal
  // A chat_alias returned by this provider's CreateAgentChat.
  string chat_alias = 2;
  string name = 3;
  reserved 4 to 15;
}

message RenameAgentChatResponse {
  reserved 1 to 15;
}

message AddAgentReactionRequest {
  string provider = 1; // must match the bearer-authenticated principal
  string response_id = 2; // the streaming response handle from Start
  // Provider-generated idempotency key. Reusing it returns the first call's
  // outcome with duplicate=true rather than placing a second reaction.
  string operation_id = 3;
  // One of Feishu's fixed emoji keys (e.g. "OnIt", "HEART"), not free text:
  // https://open.feishu.cn/document/server-docs/im-v1/message-reaction/emojis-introduce
  string emoji_type = 10;
  reserved 4 to 9, 11 to 31;
}

message AddAgentReactionResponse {
  bool duplicate = 1;
}

message RegisterProviderRequest {
  string provider = 1;
  repeated string capabilities = 2;
}

message RegisterProviderResponse {
  bool registered = 1;
}

// Acquisition requires an unexpired ingress scope; renewal requires that same
// provider's existing unexpired lease. A lease lasts at most seven days.
message RetainAgentConversationRequest {
  string provider = 1;
  string conversation_id = 2;
  string lease_id = 3;
  int64 ttl_seconds = 4;
  // Only task creation sets acquire. Renewal never recreates a missing lease.
  bool acquire = 5;
}
message RetainAgentConversationResponse { int64 expires_at_unix_seconds = 1; }
message ReleaseAgentConversationRequest {
  string provider = 1;
  string conversation_id = 2;
  string lease_id = 3;
}
message ReleaseAgentConversationResponse {}
