syntax = "proto3";

package feishubotd.v1;

option go_package = "feishu-botd/gen/feishubotd/v1;feishubotdv1";

// BotdHealthService exposes liveness and readiness. It is a separate service
// because it rarely changes and stays unauthenticated even on the loopback TCP
// path. It mirrors GET /healthz and GET /readyz so one internal implementation
// backs both transports.
service BotdHealthService {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc Ready(ReadyRequest) returns (ReadyResponse);
}

message HealthRequest {}

message HealthResponse {
  string status = 1; // "ok"
  string service = 2; // "feishu-botd"
  string version = 3; // e.g. "0.1.0"
}

message ReadyRequest {}

message ReadyResponse {
  bool ready = 1;
  // Check name -> state string ("ok" | "missing_credentials" | ...). A map so
  // new checks are non-breaking. Redacted; never contains secrets or raw chat
  // ids.
  map<string, string> checks = 2;
  // The config the daemon is running on. Informational: a rejected reload
  // leaves botd serving its previous config, so it never makes botd unready.
  ConfigStatus config = 3;
}

message ConfigStatus {
  // 1 for the config botd started with, one more for every applied reload.
  uint64 generation = 1;
  // Outcome of the most recent reload attempt: "" (none yet), "ok", or
  // "rejected".
  string last_reload = 2;
  // When that attempt happened, in Unix seconds; 0 when there was none.
  int64 last_reload_unix = 3;
  // Settings changed on disk that only take effect when botd restarts.
  repeated string restart_required = 4;
}
